<!doctype html><html><head><meta charset="utf-8"><style>

@font-face{font-family:BC;font-weight:800;src:url(node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-normal.woff2)}

*{box-sizing:border-box;margin:0}
body{width:var(--w);height:var(--h);overflow:hidden;font-family:B;color:#f5efe1;position:relative;
 background:radial-gradient(110% 80% at 90% 5%,rgba(95,179,179,.32),transparent 60%),linear-gradient(170deg,#0f4c5c 0%,#0b2f3c 55%,#082430 100%)}
.gift body,body.gift{background:radial-gradient(90% 70% at 100% 0%,rgba(232,87,30,.34),transparent 60%),linear-gradient(165deg,#0f4c5c,#082430)}
.pad{position:absolute;inset:0;padding:calc(var(--u)*5.5);display:flex;flex-direction:column;z-index:2}

.sub{font-size:calc(var(--u)*3.3);line-height:1.3;color:#d6e4e2;margin-top:calc(var(--u)*2.4);max-width:var(--sw);font-weight:500}

.card .lm{font-size:calc(var(--u)*2.9);color:#10232d}.card .pro{font:700 calc(var(--u)*2.2)/1.1 BC;letter-spacing:.08em;color:#e8571e;text-transform:uppercase;text-align:left}
.card .nm{font-size:calc(var(--u)*2.1)}.card img{width:calc(var(--u)*var(--qr));height:calc(var(--u)*var(--qr))}
.card .sc{font:700 calc(var(--u)*2.1)/1.2 B}

.chip small{font:500 calc(var(--u)*2.2)/1.2 B;text-transform:none;letter-spacing:0;display:block;opacity:.9;margin-top:calc(var(--u)*.5)}

.go{background:linear-gradient(135deg,#239157,#1a6a40)}.no{background:linear-gradient(135deg,#c64634,#97291d)}

</style></head><body><script>
const P=new URLSearchParams(location.search), k=P.get('k'), w=+P.get('w'), h=+P.get('h');
const tall=h>w*1.3, wide=w>h*1.3; const u=Math.min(w,h)/100*(wide?1.25:1);
const st=document.documentElement.style; st.setProperty('--w',w+'px'); st.setProperty('--h',h+'px'); st.setProperty('--u',u+'px');
const mark=`<svg viewBox="0 0 64 64"><path d="M32 3C19.3 3 9 13.1 9 25.6 9 42.4 32 61 32 61s23-18.6 23-35.4C55 13.1 44.7 3 32 3z" fill="#e8571e"/><circle cx="32" cy="25" r="15.5" fill="#0b2f3c"/><path d="M19.5 25.5c4.6-6.2 12.6-8 19.2-3.7l4.9-3.6-1.2 6.9 1.2 6.9-4.9-3.6c-6.6 4.3-14.6 2.5-19.2-2.9z" fill="#f5efe1"/><circle cx="25" cy="24.6" r="1.4" fill="#0b2f3c"/><path d="M14 33.5c3 1.6 6 1.6 9 0s6-1.6 9 0 6 1.6 9 0 6-1.6 9 0" stroke="#5fb3b3" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`;
const logo=`<div class="logo">${mark}<div class="lw"><div class="lt">Destination</div><div class="lm">Catch</div></div></div>`;
let html='';
if(k==='gift'){
  document.body.className='gift';
  st.setProperty('--hs',wide?9.5:tall?13.5:11.5); st.setProperty('--hw',wide?'52%':tall?'100%':'62%'); st.setProperty('--sw',wide?'50%':tall?'92%':'56%');
  st.setProperty('--cw',wide?30:tall?58:33); st.setProperty('--qr',wide?17:tall?36:19);
  st.setProperty('--cr',wide?'7%':tall?'21%':'5%'); st.setProperty('--ct',wide?'14%':tall?'auto':'27%'); st.setProperty('--cb',tall?'14%':'auto');
  html=`<div class="pad">${logo}<div class="kick">Christmas, sorted</div><h1>A present for <span>the fisho</span></h1>
  <div class="sub">A year of Destination Catch Pro for A$39.99. Print the card or send it. They scan it and their year starts.</div>
  <div class="cta"><div class="btn">Give a membership</div><div class="url">destinationcatch.com.au/gift</div></div></div>
  <div class="card"><div class="logo">${mark}<div><div class="lm">Destination Catch</div><div class="pro">A year of Pro</div></div></div><div class="nm">To <b>Dad</b> · From <b>The kids</b></div><img src="gift-qr.svg"><div class="sc">Scan to start your year</div></div>
  ${tall?'':`<img class="fish" src="species/snapper.webp" style="width:${wide?24:38}%;${wide?'right:36%;bottom:-3%':'right:-10%;bottom:16%'};transform:rotate(-8deg);opacity:.6">`}`;
}else{
  st.setProperty('--hs',wide?10.5:tall?16:11); st.setProperty('--hw',wide?'55%':'100%'); st.setProperty('--sw',wide?'50%':tall?'92%':'70%'); st.setProperty('--chw',tall?'100%':'62%');
  html=`<div class="pad">${logo}<h1 style="margin-top:calc(var(--u)*${tall?7:4.5})">Where are they <span>biting?</span></h1>
  <div class="sub">Type in where you're fishing. Get the spots, the tides and weather, what to rig up with, and a straight go or no-go.</div>
  ${wide?'':`<div class="chips" style="zoom:${tall?1.45:1};margin-top:calc(var(--u)*${tall?4:2.6})"><div class="chip go"><div>Saturday<small>Light winds, rising tide</small></div><b>Go</b></div><div class="chip no"><div>Sunday<small>Blowing 25 knots onshore</small></div><b>No go</b></div></div><div class="eg">Example only</div>`}
  <div class="cta"><div class="btn">Free. No download.</div><div class="url">destinationcatch.com.au</div></div></div>
  <img class="fish" src="species/australian-salmon.webp" style="width:${wide?40:tall?78:50}%;right:${wide?'3%':tall?'-14%':'-12%'};top:${wide?'16%':tall?'4%':'3%'};transform:rotate(-6deg);opacity:${wide?1:.5}">
  ${wide?`<img class="fish" src="species/dusky-flathead.webp" style="width:30%;right:14%;top:58%;transform:rotate(4deg)">`:''}`;
}
document.body.innerHTML=html;
</script></body></html>
